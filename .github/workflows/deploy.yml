name: Deploy track

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USERNAME }}
          PORT: ${{ secrets.SERVER_PORT }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          missing=
          [ -n "$HOST" ] || missing="$missing SERVER_HOST"
          [ -n "$USER" ] || missing="$missing SERVER_USERNAME"
          [ -n "$PORT" ] || missing="$missing SERVER_PORT"
          [ -n "$KEY" ] || missing="$missing SSH_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "Пустые секреты:$missing"
            echo "Добавь их в YakovSPb/track → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Секреты на месте. Длина ключа: ${#KEY}"

      - name: Upload site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "index.html,app.css,app.js,manifest.json,assets,server"
          target: /var/www/track.diabal.ru/
          overwrite: true
          rm: true

      - name: API, nginx, SSL
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          command_timeout: 10m
          script: |
            set -euo pipefail
            ROOT=/var/www/track.diabal.ru
            mkdir -p "$ROOT" /var/lib/track
            cd "$ROOT/server"
            npm install --omit=dev
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
            chmod +x "$ROOT/server/ensure-nginx-api.sh"
            bash "$ROOT/server/ensure-nginx-api.sh"
            nginx -t
            systemctl reload nginx
            if [ ! -f /etc/letsencrypt/live/track.diabal.ru/fullchain.pem ]; then
              certbot --nginx -d track.diabal.ru --non-interactive --agree-tos --redirect
            fi
            curl -fsS http://127.0.0.1:3010/health
